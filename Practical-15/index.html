   <script>
       const logoutToken = document.getElementById('logout-csrf-token');
       if (logoutToken) {
           fetch('php/login.php?csrf=1', { credentials: 'same-origin', cache: 'no-store' })
               .then((response) => {
                   if (!response.ok) throw new Error('Could not initialize logout.');
                   return response.json();
               })
               .then((data) => {
                   logoutToken.value = data.csrf_token;
               })
               .catch(() => {
                   const logoutButton = document.querySelector('form[action="php/logout.php"] button[type="submit"]');
                   if (logoutButton) logoutButton.disabled = true;
               });
       }
   </script>

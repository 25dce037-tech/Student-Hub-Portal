<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Register</title>
        <link rel="stylesheet" href="../css/script.css">
        <script src="../js/script.js"></script>
    </head>
    
    <body> 
        
        <main>
            <div style="border: 2px solid #0f4c81; background-color: #ffffff; width: 450px; height: auto; margin: 0 auto; padding: 25px; border-radius: 8px;">
                <form action="../index.html" method="get" onsubmit="return validateRegister()">
                    <h1 class="page-header">Register</h1>
                    <br>
                    <hr>
                    <br>
                    <h2>Student Information</h2>
                    <label>Full Name:</label>
                    <input type="text" id="fullname">
                    <br><br>

                    <label>Student ID:</label>
                    <input type="text" id="studentid">
                    <br><br>

                    <label>Date of Birth:</label>
                    <input type="date">
                    <br><br>
                <div class="gender">

                    <span class="gender-title">Gender</span>

                    <input type="radio" id="male" name="gender" value="Male">
                    <label for="male">Male</label>

                    <input type="radio" id="female" name="gender" value="Female">
                    <label for="female">Female</label>

                </div>
                    <hr>
                    <h2>Contact Information</h2>
                    <label>Mobile Number:</label>
                    <input type="text" id="mobile">
                    <br><br>

                    <label>Email:</label>
                    <input type="text" id="email">
                    <br><br>

                    <label>Address:</label>
                    <textarea rows="4" cols="30"></textarea>
                    <hr>
                    <h2>Academic Information</h2>
                    <label>Course:</label>
                    <select>
                        <option>Computer Engineering</option>
                        <option>Information Technology</option>
                        <option>Mechanical Engineering</option>
                    </select>
                    <br><br>

                    <label>Year:</label>
                    <select>
                        <option>First Year</option>
                        <option>Second Year</option>
                        <option>Third Year</option>
                        <option>Fourth Year</option>
                    </select>
                    <br><br>

                    <label>Division:</label>
                    <input type="text" id="division">
                    <br><br>
                    <input type="submit" value="Register" class="btn">
                    <input type="reset" value="Clear" class="btn">
                    <a href="Login.html" class="btn">Already have an account?</a>
                </form>
            </div>
        </main>
    </body>
</html>

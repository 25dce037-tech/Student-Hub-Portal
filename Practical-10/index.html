<!DOCTYPE html>
<html lang="eng">
<head>
<title>Student Hub Portal</title>
<link rel="stylesheet" href="css/script.css">
<script src="js/script.js"></script>
</head>
<body>

   <h1 align="center">Student Hub Portal</h1>
    
   <main class="home-main">

    <nav class="home-nav" align="center">
        <hr>
        <br>
        <div class="home-nav-links">
            <a href="pages/Profile.html" class="btn">Profile</a>
            <a href="pages/Attendance.html" class="btn">Attendance</a>
            <a href="pages/Timetable.html" class="btn">Timetable</a>
            <a href="pages/Courses.html" class="btn">Courses</a>
            <a href="pages/Assignment.html" class="btn">Assignment</a>
            <a href="pages/Result.html" class="btn">Result</a>
            <a href="pages/Notices.html" class="btn">Notices</a>
            <a href="pages/Contact.html" class="btn">Contact</a>
            <a href="http://localhost/Student%20Hub%20Portal/pages/Login.html" class="btn">Login</a>
            <a href="http://localhost/Student%20Hub%20Portal/pages/Register.html" class="btn">Register</a>
            <form action="php/logout.php" method="post">
                <input type="hidden" name="csrf_token" id="logout-csrf-token">
                <button type="submit" class="btn">Logout</button>
            </form>
        </div>
        <br>
        <br>
        <hr>
        <br>
        <h2>Welcome</h2>
        <p>
        Student Hub Portal is a simple website for students.
        Students can view courses, attendance, assignments,
        results, notices and profile information.
        </p> 
        <br>

    </nav>
   </main>
   <section>

   </section>

   <footer>

    <p>Student Hub Portal</p>

    </footer>

    <script>
        fetch('php/login.php?csrf=1', { credentials: 'same-origin', cache: 'no-store' })
            .then((response) => {
                if (!response.ok) throw new Error('Could not initialize logout.');
                return response.json();
            })
            .then((data) => {
                document.getElementById('logout-csrf-token').value = data.csrf_token;
            })
            .catch(() => {
                document.querySelector('form[action="php/logout.php"] button[type="submit"]').disabled = true;
            });
    </script>
</body>
</html>

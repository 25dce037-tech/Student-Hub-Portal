<!DOCTYPE html>
<html>
<head>
    <title>Contact Us</title>
    <link rel="stylesheet" href="../css/script.css">
    <script src="../js/script.js"></script>
</head>

<body>

    <h1 class="page-header">Contact Us</h1>
    <main>
        <section class="card">
            <form>
                <table>
                    <tr>
                        <td><b>Full Name</b></td>
                        <td><input type="text" placeholder="Enter your name"></td>
                    </tr>
                    <tr>
                        <td><b>Email</b></td>
                        <td><input type="email" placeholder="Enter your email"></td>
                    </tr>
                    <tr>
                        <td><b>Phone Number</b></td>
                        <td><input type="tel" placeholder="Enter your phone number"></td>
                    </tr>
                    <tr>
                        <td><b>Subject</b></td>
                        <td><input type="text" placeholder="Enter subject"></td>
                    </tr>
                    <tr>
                        <td><b>Message</b></td>
                        <td>
                            <textarea rows="5" cols="30" placeholder="Write your message"></textarea>
                        </td>
                    </tr>
                    <tr>
                        <td colspan="2" align="center">
                            <input type="submit" value="Send Message">
                            <input type="reset" value="Clear" class="btn">
                        </td>
                    </tr>
                </table>
            </form>
        </section>

        <section class="card">
            <h2>College Contact Details</h2>
            <p><b>Address:</b> Depstar College, near vadtal, Anand</p>
            <p><b>Email:</b> studenthub@gmail.com</p>
            <p><b>Phone:</b> +91 9876543210</p>
        </section>

        <section class="card page-actions">
            <a href="../index.html" class="btn">Back to Dashboard</a>
        </section>
    </main>

    <footer>
        <p>Student Hub Portal</p>
    </footer>
</body>
</html>
